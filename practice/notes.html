const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
const root = document.getElementById('notes'), toc = document.getElementById('toc');

for (const cat of [...new Set(NOTES.map(n => n.cat))]) {
  const id = 'cat-' + cat;
  const chip = el('a', 'chip', cat); chip.href = '#' + id; toc.append(chip);
  const group = el('section', 'cat'); group.id = id;
  group.append(el('h2', '', cat));
  for (const n of NOTES.filter(n => n.cat === cat)) {
    const box = el('div', 'note');
    box.append(el('h3', '', n.title));
    if (n.flow) box.append(el('div', 'flow', n.flow));
    if (n.rows) {
      const dl = el('dl');
      for (const [t, d] of n.rows) {
        const row = el('div', 'row'); row.dataset.text = (n.title + t + d).toLowerCase();
        row.append(el('dt', '', t), el('dd', '', d));
        dl.append(row);
      }
      box.append(dl);
    }
    if (n.code) { const pre = el('pre', '', n.code); pre.dataset.text = (n.title + n.code).toLowerCase(); box.append(pre); }
    group.append(box);
  }
  root.append(group);
}

document.getElementById('search').oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  for (const box of root.querySelectorAll('.note')) {
    let hits = 0;
    for (const r of box.querySelectorAll('[data-text]')) { const hit = !q || r.dataset.text.includes(q); r.hidden = !hit; hits += hit; }
    box.hidden = !hits;
  }
  for (const g of root.children) g.hidden = !g.querySelector('.note:not([hidden])');
};
