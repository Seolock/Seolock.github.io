<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>요약 정리</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav><a href="index.html"><b>요약 정리</b></a><a href="practice.html">연습</a></nav>
<h1>정보처리기사 실기 핵심요약</h1>
<input id="search" placeholder="검색 (주제, 내용)">
<div id="list"></div>

<script src="data.js"></script>
<script src="fmt.js"></script>
<script>
const list = document.getElementById('list');
const topics = DATA.filter(d => !d.parent);
const subCount = {};
DATA.forEach(d => { if (d.parent) subCount[d.parent] = (subCount[d.parent] || 0) + 1; });
const chNo = ch => ch.match(/^\d+/)[0];
const grade = d => (d.explain.match(/중요도 ([ABC])/) || [])[1] || '';
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };

// 챕터 → 주제 아코디언
for (const ch of [...new Set(topics.map(d => d.ch))]) {
  const items = topics.filter(d => d.ch === ch);
  const terms = items.reduce((n, d) => n + (subCount[d.id] || 0), 0);
  const chap = el('details', 'chapter');
  const sum = el('summary');
  sum.append(el('b', '', ch), el('span', 'meta', ` 주제 ${items.length} · 용어 ${terms}`));
  const go = el('a', 'practice-link', '연습 ▶'); go.href = `practice.html?ch=${chNo(ch)}`;
  sum.append(go);
  chap.append(sum);
  for (const d of items) {
    const t = el('details', 'topic');
    t.dataset.text = (d.q + d.a).toLowerCase();
    const ts = el('summary');
    ts.append(el('span', 'grade g' + grade(d), grade(d)), el('span', '', ' ' + d.q));
    if (subCount[d.id]) ts.append(el('span', 'meta', ` · 용어 ${subCount[d.id]}`));
    t.append(ts);
    t.addEventListener('toggle', () => {  // 내용은 처음 열 때 그림
      if (!t.open || t.querySelector('.a')) return;
      const a = el('div', 'a'); a.innerHTML = fmt(d.a);
      const ex = el('div', 'ex', d.explain); ex.insertAdjacentHTML('beforeend', pdfLink(d));
      if (subCount[d.id]) ex.insertAdjacentHTML('beforeend', ` · <a href="practice.html?item=${d.id}">이 주제 연습 ▶</a>`);
      t.append(a, ex);
    });
    chap.append(t);
  }
  list.append(chap);
}

document.getElementById('search').oninput = e => {
  const term = e.target.value.trim().toLowerCase();
  for (const chap of list.children) {
    let hits = 0;
    for (const t of chap.querySelectorAll('.topic')) {
      const hit = !term || t.dataset.text.includes(term);
      t.hidden = !hit; hits += hit;
    }
    chap.hidden = !hits;
    chap.open = !!term && hits > 0;
  }
};
</script>
</body>
</html>
